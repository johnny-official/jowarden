name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate translations
        run: npm run i18n:validate

      - name: TOTP security tests
        run: npm run test:totp-rotation

      - name: Config compatibility tests
        run: npm run test:config-compatibility

      - name: Web Crypto tests
        run: npm run test:web-crypto

      - name: Notifications security tests
        run: npm run test:notifications-security

      - name: WebAuthn connector tests
        run: npm run test:webauthn-connectors
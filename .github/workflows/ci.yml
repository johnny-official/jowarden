name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a production deployment; cancel obsolete PR checks only.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run i18n:validate
      - run: npm run test:config-compatibility
      - run: npm run test:vault-compatibility
      - run: npm run test:web-crypto
      - run: npm run test:notifications-security
      - run: npm run test:webauthn-connectors
      - run: npm run build
      - name: Validate Worker bundle without deploying
        run: npx --no-install wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"

  deploy:
    name: Deploy production
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: jowarden-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Deploy validated commit to Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."
            exit 1
          fi
          if [ -z "$VAULT_DOMAIN" ]; then
            echo "::error::Configure the VAULT_DOMAIN secret in the production environment."
            exit 1
          fi
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          template = Path("wrangler.toml").read_text()
          domain = os.environ["VAULT_DOMAIN"]
          label = r"[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?"
          if len(domain) > 253 or not re.fullmatch(rf"{label}(?:\.{label})+", domain):
              raise SystemExit("VAULT_DOMAIN must be a hostname, without scheme, path or whitespace")
          placeholder = 'pattern = "VAULT_DOMAIN_PLACEHOLDER"'
          if template.count(placeholder) != 1:
              raise SystemExit("Expected exactly one domain placeholder in wrangler.toml")
          Path("wrangler.deploy.toml").write_text(
              template.replace(placeholder, f'pattern = "{domain}"')
          )
          PY
          npx --no-install wrangler deploy --config wrangler.deploy.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAULT_DOMAIN: ${{ secrets.VAULT_DOMAIN }}
          WRANGLER_SEND_METRICS: "false"

name = "jowarden"
main = "src/index.ts"
compatibility_date = "2026-09-25"

# Disable public workers.dev production URL:
workers_dev = false
# Disable version/preview URLs:
preview_urls = false

# Smaller Worker bundle
minify = true
# Preserve variables configured from Cloudflare Dashboard
keep_vars = true

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./dist"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = [ "*/5 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "nodewarden-db"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[durable_objects.bindings]]
name = "BACKUP_TRANSFER_RUNNER"
class_name = "BackupTransferRunner"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "nodewarden-attachments"

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]

[[migrations]]
tag = "v2-backup-transfer-runner"
new_sqlite_classes = [ "BackupTransferRunner" ]


# Enable production observability.
[observability]
enabled = true

# Keep logs at 100%.
# NodeWarden is normally low/moderate traffic and auth errors are useful to retain.
[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# Prevent query-string values such as tokens from appearing in logs/traces.
redact_query_string = true

# Tracing is useful, but there is little benefit in tracing every request.
[observability.traces]
enabled = true
head_sampling_rate = 0.05